name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "${{ inputs.version }}"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Test and build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $asset = "dist\Mihomo-Traffic-Ledger-Setup-v$version.exe"
          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          "$checksum  $(Split-Path -Leaf $asset)" | Set-Content -Encoding ascii "$asset.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Mihomo-Traffic-Ledger-v${{ steps.version.outputs.version }}
          path: |
            dist/Mihomo-Traffic-Ledger-Setup-v${{ steps.version.outputs.version }}.exe
            dist/Mihomo-Traffic-Ledger-Setup-v${{ steps.version.outputs.version }}.exe.sha256

      - name: Upload assets to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/Mihomo-Traffic-Ledger-Setup-v${{ steps.version.outputs.version }}.exe
            dist/Mihomo-Traffic-Ledger-Setup-v${{ steps.version.outputs.version }}.exe.sha256
